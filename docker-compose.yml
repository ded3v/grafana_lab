services:
  carnivorous-garden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carnivorous-garden
    ports:
      - "5005:5005"
    volumes:
      - ./logs:/app/logs
    networks:
      - loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/tmp/app-logs:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - carnivorous-garden
      - loki
    networks:
      - loki

  loki:
    image: grafana/loki:latest
    # Executa como root apenas neste laboratorio local para permitir escrita no volume
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - "3000:3000"
    depends_on:
      - loki
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat > /etc/grafana/provisioning/datasources/loki.yml <<'EOF'
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: true
        EOF
        exec /run.sh
    networks:
      - loki

networks:
  loki:
    driver: bridge

volumes:
  loki-data:
